; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
    NMAxeGamma
packages_dir = .pio/packages

[common]
platform = espressif32@6.6.0
board = AxeSeries
framework = arduino
; Temporary partial full-flash mode for the BSP-first skeleton.
; Flash bootloader + ota_data + partitions + firmware together, but skip
; spiffs.bin until the new web/SPiffs pipeline is restored.
; TODO(agent): add spiffs.bin back into upload_command after the new web stack
; is rebuilt and the SPIFFS payload is ready again.
upload_protocol = custom
build_src_filter =
    -<*>
    +<../src/main.cpp>
    +<../src/app/>
    +<../src/bsp/>
    +<../src/config/>
    +<../src/services/>
    +<../src/state/>
    +<../src/system/>
    +<../src/product/>
    +<../src/hal/>
    +<../src/drivers/>
    +<../src/ui/>
board_build.filesystem = spiffs
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions/partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
build_flags =
    -std=c++17
    -I "./src"
    -D BOARD_HAS_PSRAM
    -D CONFIG_LWIP_ARP_TABLE_SIZE=32
    -D LWIP_ARP_QUEUE_LEN=1
    -D LV_LVGL_H_INCLUDE_SIMPLE=1
    -D LV_CONF_INCLUDE_SIMPLE=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D LVGL_ENABLE
    -Wl,--allow-multiple-definition
lib_deps =
    lvgl/lvgl@^8.4.0
    bblanchon/ArduinoJson@^6.21.5
extra_scripts = pre:build_web.py
upload_command = $PYTHONEXE .pio\packages\tool-esptoolpy\esptool.py --chip esp32s3 --port $UPLOAD_PORT --baud $UPLOAD_SPEED --before default_reset --after hard_reset write_flash -z --flash_mode keep --flash_freq 80m --flash_size 16MB 0x0000 partitions\bootloader.bin 0xf90000 partitions\ota_data_initial.bin 0x8000 .pio\build\$PIOENV\partitions.bin 0x10000 .pio\build\$PIOENV\firmware.bin
platform_packages =
    framework-arduinoespressif32@~3.20014.0
    platformio/tool-esptoolpy@^1.40501.0

; ── Board-specific environments ──────────────────────────────────────────────
; Each env defines exactly one BOARD_* macro to select the target hardware.

[env:NMAxe]
extends = common
build_flags =
    ${common.build_flags}
    -D BOARD_NMAXE

[env:NMAxeGamma]
extends = common
build_flags =
    ${common.build_flags}
    -D BOARD_NMAXE_GAMMA

[env:NMQAxePP]
extends = common
build_flags =
    ${common.build_flags}
    -D BOARD_NMQAXE_PP

[env:NMQAxePPRev61]
extends = common
build_flags =
    ${common.build_flags}
    -D BOARD_NMQAXE_PP_REV61

[env:NMQAxePPRev81]
extends = common
build_flags =
    ${common.build_flags}
    -D BOARD_NMQAXE_PP_REV81

