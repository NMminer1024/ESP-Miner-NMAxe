<div class="best-diff-chart-container">
  <div class="chart-header">
    <h3 class="chart-title">🏆 Top 10 Best Difficulty History</h3>
    <div class="chart-header-right">
      <button type="button" class="clear-btn" (click)="showClearTopDiffsDialog()" title="Clear all best difficulty history">clear</button>
      <app-help-btn key="best-diff"></app-help-btn>
    </div>
  </div>

  <div class="best-diff-banner" *ngIf="bestDiff"
       [title]="hasSessionEver ? 'Session best / all time best' : 'Best difficulty ever'">
    <span class="best-diff-session" *ngIf="hasSessionEver">{{ bestDiffSession }}</span>
    <span class="best-diff-sep" *ngIf="hasSessionEver">/</span>
    <span class="best-diff-ever">{{ hasSessionEver ? bestDiffEver : bestDiff }}</span>
  </div>

  <div class="chart-wrapper">
    <!-- 原生Canvas实现，参考monitor组件 -->
    <canvas #chartCanvas 
            class="chart-canvas">
    </canvas>
  </div>
</div>

<!-- Clear Top-10 history confirmation (in-page modal) -->
<p-dialog header="Clear Best Difficulty History"
          [(visible)]="clearTopDiffsDialogVisible"
          [modal]="true"
          [style]="{width: 'min(420px, 90vw)'}"
          [closable]="true"
          [dismissableMask]="true">
    <p>This will erase the lifetime Top-10 best difficulty history on this miner, including the #1 entry and Best Ever Difficulty.</p>
    <ng-template pTemplate="footer">
        <button pButton type="button" label="Cancel"
                icon="pi pi-times"
                class="p-button-secondary p-button-outlined"
                (click)="clearTopDiffsDialogVisible = false">
        </button>
        <button pButton type="button" label="Clear"
                icon="pi pi-trash"
                class="p-button-danger"
                (click)="clearTopDiffs()">
        </button>
    </ng-template>
</p-dialog>
